train:
  max_steps: 2000
  effective_query_batch_size: 64
  walk_batch_size: 16
  lr: 0.001
  min_lr: 0.0001
  warmup_steps: 100
  betas: [0.9, 0.99]
  weight_decay: 0.01
  grad_clip: 1.0
  precision: bf16
  eval_interval: 1000
  save_interval: 500
  log_interval: 10
  microbatch_size: 0
  bucket_multiple: 64
  pin_memory: true
  deterministic: false
  stage: context
  exposure_seed: 0
  keep_last: 2
  eval_samples: 64
  free_gen_samples: 16
  model_seed: 0
