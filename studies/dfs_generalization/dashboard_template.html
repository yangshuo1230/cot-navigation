<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DFS：图规模与图族泛化</title>
<style>body{font:15px system-ui;background:#f5f7fa;color:#18283c;margin:24px auto;max-width:1280px;padding:0 16px}h1{font-size:26px}section{background:white;border:1px solid #dce2ea;border-radius:12px;padding:18px;margin:16px 0}.controls{display:flex;gap:18px;flex-wrap:wrap}select,button{padding:6px;font:inherit}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:9px;border-bottom:1px solid #e4e9ef;text-align:right}td:first-child,th:first-child{text-align:left}.scroll{overflow:auto}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}svg{width:100%;height:auto}p,li{line-height:1.7}.muted{color:#56677e}@media(max-width:760px){.charts{grid-template-columns:1fr}}</style>
<h1>DFS：图规模 × 简单／复杂图泛化</h1><p id="progress"></p>
<section class="controls"><label>查询 <select id="population"><option value="positive">可达（主分析）</option><option value="negative">不可达</option><option value="all">全部（各半）</option></select></label><label>首错图 <select id="family"><option value="simple">简单图</option><option value="complex">复杂图</option></select></label><label>节点数 <select id="nodes"><option>32</option><option>64</option><option>100</option><option>144</option><option>169</option><option>196</option></select></label><button id="export">导出当前表格CSV</button></section>
<div class="charts"><section><h3>答案准确率</h3><div id="accuracy"></div></section><section><h3>CoT合法率</h3><div id="legality"></div></section></div>
<section><h3>各规模明细</h3><p class="muted">数值为已完成模型seed的均值；括号为模型数。错误／截断为各查询所占比例。</p><div class="scroll"><table id="table"></table></div></section>
<section><h3>首错类型分布</h3><p class="muted">比例以该组全部查询为分母；不把未完成但尚无首错的轨迹归为“无错合法”。</p><div id="errors"></div><div class="scroll"><table id="errorTable"></table></div></section>
<section><h3>设置与解释边界</h3><ul id="notes"></ul><p>折线分开显示简单图（实线）与复杂图（虚线），蓝色为baseline，橙色为纠错模型。线段连接规模；每个点只代表该规模的测试分布。</p></section>
<script>const D=__DATA__;const $=id=>document.getElementById(id),arms=['matched_clean','correction'],colors=['#3378b9','#d56b2c'],names=['baseline','纠错'],ns=[32,64,100,144,169,196];let csv='';
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}function pct(x){return x==null?'待运行':(100*x).toFixed(2)+'%'}
function rows(f,n,a){return D.results.filter(r=>r.population===$('population').value&&r.family===f&&r.n_nodes===n&&r.arm===a)}
function chart(key){let s='<svg viewBox="0 0 560 310" role="img">';for(let i=0;i<=4;i++){let y=255-i*52;s+=`<path d="M45 ${y}H535" stroke="#e4e9ef"/><text x="5" y="${y+4}" font-size="12">${i*25}%</text>`}for(const [j,n]of ns.entries())s+=`<text x="${50+j*95}" y="278" text-anchor="middle" font-size="12">${n}</text>`;for(const f of ['simple','complex'])for(const[a,arm]of arms.entries()){let points=[];ns.forEach((n,j)=>{const v=avg(rows(f,n,arm).map(r=>r.metrics[key]));if(v!==null){let x=50+j*95,y=255-v*208;points.push([x,y]);s+=`<circle cx="${x}" cy="${y}" r="4" fill="${colors[a]}"><title>${names[a]} ${f} N${n}: ${pct(v)}</title></circle>`}});if(points.length)s+=`<polyline points="${points.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${colors[a]}" stroke-width="2" ${f==='complex'?'stroke-dasharray="6 4"':''}/>`}return s+'</svg>'}
function render(){const columns=['图族','N','模型','seed数','准确率','CoT合法率','完全无错合法率','不合法但答对','预算截断','无首错但未完成','参考可完成子集准确率'];let html='<tr>'+columns.map(c=>'<th>'+c+'</th>').join('')+'</tr>';const lines=[columns.join(',')];for(const f of ['simple','complex'])for(const n of ns)for(const[a,arm]of arms.entries()){const rr=rows(f,n,arm),m=k=>avg(rr.map(r=>r.metrics[k]));let values=[f,n,names[a],rr.length,pct(m('accuracy')),pct(m('legality')),pct(m('literal_legality')),pct(m('invalid_but_correct')),pct(m('interrupted')),pct(avg(rr.map(r=>r.metrics.no_error_incomplete/r.metrics.n))),pct(avg(rr.filter(r=>r.metrics.reference_fit_subset).map(r=>r.metrics.reference_fit_subset.accuracy)))];html+='<tr>'+values.map(v=>'<td>'+v+'</td>').join('')+'</tr>';lines.push(values.join(','))}$('table').innerHTML=html;csv=lines.join('\n');$('accuracy').innerHTML=chart('accuracy');$('legality').innerHTML=chart('legality');
const f=$('family').value,n=+$('nodes').value,groups=arms.map(a=>rows(f,n,a)),types=[...new Set(groups.flatMap(g=>g.flatMap(r=>Object.keys(r.metrics.first_errors))))].sort();let bars='<svg viewBox="0 0 900 '+Math.max(70,types.length*44+30)+'">',et='<tr><th>首错类型</th><th>baseline数量</th><th>baseline占全部</th><th>纠错数量</th><th>纠错占全部</th></tr>';types.forEach((t,j)=>{bars+=`<text x="0" y="${j*44+18}" font-size="12">${t}</text>`;let vals=[];groups.forEach((g,a)=>{let count=g.reduce((s,r)=>s+(r.metrics.first_errors[t]||0),0),den=g.reduce((s,r)=>s+r.metrics.n,0),rate=den?count/den:0;vals.push(count,pct(den?rate:null));bars+=`<rect x="265" y="${j*44+a*15}" width="${rate*540}" height="12" fill="${colors[a]}"/><text x="${270+rate*540}" y="${j*44+a*15+11}" font-size="11">${pct(den?rate:null)}</text>`});et+='<tr><td>'+t+'</td>'+vals.map(v=>'<td>'+v+'</td>').join('')+'</tr>'});$('errors').innerHTML=bars+'</svg>';$('errorTable').innerHTML=et;location.hash=new URLSearchParams({population:$('population').value,family:f,nodes:n})}
$('progress').textContent=`已完成 ${D.complete_cells}/96 个模型×图设置；8个冻结模型，12种固定测试集，每种512查询。尚未运行的结果保留为空。`;$('notes').innerHTML=D.notes.map(n=>'<li>'+n+'</li>').join('');const h=new URLSearchParams(location.hash.slice(1));for(const id of ['population','family','nodes']){if(h.has(id)&&[...$(id).options].some(o=>o.value===h.get(id)))$(id).value=h.get(id);$(id).onchange=render}$('export').onclick=()=>{const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='dfs_generalization.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();</script></html>
